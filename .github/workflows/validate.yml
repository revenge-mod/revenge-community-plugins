# PR build validation

name: Validate

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }} # For Gradle to download the API dependency.

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://revenge.local \
            --out /tmp/index.json
          cat /tmp/index.json

      - name: Upload built plugins
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: build/dist/*.zip
          if-no-files-found: warn

      - name: Upload generated index
        uses: actions/upload-artifact@v7
        with:
          name: index
          path: /tmp/index.json
          if-no-files-found: error
          archive: false
